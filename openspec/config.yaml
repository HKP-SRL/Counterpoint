schema: spec-driven

# Constraints an agent cannot infer from the code. Product context lives in VISION.md,
# decisions in docs/decisions.md, research in docs/research/.
context: |
  Counterpoint is a local mission-control tool for autonomous spec-driven development with
  Claude Code. It reads a host project's planning through a framework adapter (OpenSpec first),
  lets the owner sign changes into a runway, and builds approved changes into per-change PRs.
  First host: Cena. The owner is a single person; there are no other users.

  Hard constraints:
  - Agent runtime is Claude Code only: spawn the owner's own `claude -p` binary and parse
    stream-json behind one swappable AgentRunner port (Agent SDK only as a later second
    implementation). Sessions run non-bare so subscription login and hooks work.
  - Console UI is React 19 + Astryx (@astryxdesign/core, prebuilt CSS + themes). Never shadcn,
    never Tailwind. Served as a prebuilt SPA by the local server; live updates over SSE.
  - Framework coupling: core never knows which spec framework the host uses. Everything
    framework-specific goes through an adapter; an import rule enforces the boundary.
  - Security: the approval signing key and the start/stop token must be unreadable and unusable
    by agents; the approval key is never cached (no ssh-agent, no Keychain). Agents run as the
    same OS user, so they are the threat model.
  - Isolation: builds never touch the owner's checkout; worktrees only.
  - The server is local, host-agnostic and loopback-only (bind 127.0.0.1).
  - Context windows: no hard-coded window sizes; budgets follow the model.
  - Packaging: one npm package `@hkp/counterpoint` (modular monolith); split out an adapter
    package only when a second adapter exists.
  - Owner's machine: tools, caches and app data live on /Volumes/Dock, never the internal disk.

  Writing rules:
  - Write plain, direct English. Name host work units "changes", never "phases".
  - Specs describe observable behavior only; no internal function or module names.
